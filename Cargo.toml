[workspace]
resolver = "2"
members = [
    "crates/fcp",
    "crates/fcp-client",
    "crates/fcptemp",
    "crates/fcpctl",
    "crates/fcp-gui",
]
default-members = ["crates/fcp", "crates/fcptemp", "crates/fcp-client", "crates/fcpctl", "crates/fcp-gui"]

[workspace.package]
edition = "2021"

[workspace.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
