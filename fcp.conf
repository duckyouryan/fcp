# /etc/fcp.conf
#
# Paths are explicit on purpose. chip=NAME makes fcp refuse to start if the
# hwmon number changed and the path now belongs to another chip.
# Find the numbers:  grep -H . /sys/class/hwmon/hwmon*/name

frequency 10                 # PWM cycles per second

# pwm min=/max= are the values written to pwm_enable for "slowest" / "fastest".
# curve is TEMP:PERCENT points, linear in between, clamped outside.

fan CPU_FAN
    pwm    /sys/class/hwmon/hwmon4/pwm3_enable chip=it8792 min=2 max=0
    tach   /sys/class/hwmon/hwmon4/fan3_input  chip=it8792
    sensor /sys/class/hwmon/hwmon3/temp1_input chip=k10temp
    curve  40:0 75:100

fan SYS_FAN
    pwm    /sys/class/hwmon/hwmon4/pwm2_enable chip=it8792 min=2 max=0
    tach   /sys/class/hwmon/hwmon4/fan2_input  chip=it8792
    sensor /sys/class/hwmon/hwmon3/temp1_input chip=k10temp
    curve  40:0 75:100
